[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab"
version = "0.3.0"
description = "Single-host network attack/defense lab using Linux network namespaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.25",
    "textual>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
netlab = "netlab.cli:main"

[tool.setuptools]
packages = ["netlab", "netlab.scenarios", "netlab.defenses"]
